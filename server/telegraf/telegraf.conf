[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true

# Lit les messages nodes/<id>/telemetry publiés par le nœud (ou le simulateur)
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["nodes/+/telemetry"]
  qos = 0
  client_id = "telegraf"
  data_format = "json"
  json_string_fields = ["state"]

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "nodes/+/telemetry"
    measurement = "_/_/measurement"
    tags = "_/node_id/_"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
